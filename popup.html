<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="20" height="20">
    <h1>X Location Filter</h1>
    <label class="switch" title="Turn filter on/off">
      <input type="checkbox" id="enabled">
      <span class="slider"></span>
    </label>
  </header>

  <nav class="tabs">
    <button class="tab" data-tab="filter">Filter</button>
    <button class="tab" data-tab="history">History</button>
  </nav>

  <div id="panel-filter" class="panel">
  <p id="status" class="status"></p>

  <section>
    <h2>Allowed locations</h2>
    <form id="addForm">
      <input id="newLoc" type="text" placeholder="e.g. United States" autocomplete="off">
      <button type="submit">Add</button>
    </form>
    <ul id="list"></ul>
    <p class="hint">A post is shown if the author's "Account based in" contains any entry (case-insensitive). Empty list = nothing is filtered.</p>
  </section>

  <section>
    <h2>Options</h2>
    <label class="opt"><input type="checkbox" id="hideUnknown"> Hide accounts with no location</label>
    <label class="opt"><input type="checkbox" id="blurPending"> Blur posts while checking</label>
    <label class="opt"><input type="checkbox" id="showLabels"> Show location label on posts</label>
    <label class="opt" title="Shows every post and looks up one account every 30 seconds"><input type="checkbox" id="learningMode"> Learning mode (no filtering, slow lookups)</label>
  </section>

  <section>
    <h2>This tab</h2>
    <p id="stats" class="stats">Open x.com to see stats.</p>
  </section>

  <section>
    <h2>Account database</h2>
    <p id="dbCount" class="stats">…</p>
    <div class="row">
      <button id="openDb">Open</button>
      <button id="exportDb" class="secondary">Export</button>
      <button id="importDb" class="secondary">Import</button>
      <button id="clearDb" class="secondary danger">Clear</button>
      <input id="importFile" type="file" accept=".json,application/json" hidden>
    </div>
    <div class="row push">
      <button id="pushDb">Push to cloud</button>
      <span id="pushStatus" class="muted"></span>
    </div>
    <div class="row push">
      <button id="pullDb" class="secondary">Pull from cloud</button>
      <span id="pullStatus" class="muted"></span>
    </div>
  </section>

  <details>
    <summary>Advanced</summary>
    <label class="field">AboutAccountQuery ID override
      <input id="queryId" type="text" placeholder="auto-detect" autocomplete="off">
    </label>
    <label class="field">Cloud ingest URL override
      <input id="ingestUrl" type="password" placeholder="uses config.js" autocomplete="off">
    </label>
  </details>
  </div>

  <div id="panel-history" class="panel" hidden>
    <div class="row hist-bar">
      <label class="hist-limit">Keep last
        <input id="historyLimit" type="number" min="10" max="10000" step="10">
      </label>
      <button id="clearHistory" class="secondary danger">Clear</button>
    </div>
    <ol id="history" class="history"></ol>
  </div>

  <script src="popup.js"></script>
</body>
</html>
